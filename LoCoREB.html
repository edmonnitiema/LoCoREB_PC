<script>
/* Enregistrement des fichiers dans l'APK (Capacitor) : écrit dans le cache puis ouvre le partage Android */
(function(){
  function plug(n){
    var C=window.Capacitor;if(!C)return null;
    if(C.Plugins&&C.Plugins[n])return C.Plugins[n];
    if(typeof C.registerPlugin==='function'){try{return C.registerPlugin(n)}catch(e){}}
    return null;
  }
  function isNative(){
    var C=window.Capacitor;if(!C)return false;
    try{
      if(typeof C.isNativePlatform==='function')return !!C.isNativePlatform();
      if(typeof C.getPlatform==='function')return C.getPlatform()!=='web';
    }catch(e){}
    return /; wv\)/.test(navigator.userAgent);
  }
  function init(){
    if(window.Pont||!isNative())return;
    window.Pont={
      enregistrer:async function(name,type,b64,dossier,titre){
        var FS=plug('Filesystem'),SH=plug('Share'),repli=null;
        try{
          if(!FS)throw new Error('plugin introuvable (Filesystem)');
          if(dossier){
            /* Création du dossier dans « Documents » puis enregistrement du fichier dedans */
            try{
              try{var pm=await FS.checkPermissions();if(pm&&pm.publicStorage&&pm.publicStorage!=='granted')await FS.requestPermissions()}catch(e){}
              var rel=dossier+'/'+name;
              await FS.writeFile({path:rel,data:b64,directory:'DOCUMENTS',recursive:true});
              var g=await FS.getUri({path:rel,directory:'DOCUMENTS'});
              var ch=decodeURI(String(g.uri).replace(/^file:\/\//,''));
              return {chemin:ch,dossier:dossier,dossierChemin:ch.slice(0,ch.lastIndexOf('/')),uri:g.uri};
            }catch(e){repli=String((e&&e.message)||e)}
          }
          if(!SH)throw new Error('plugin introuvable (Share)');
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          await SH.share({title:name,url:w.uri,dialogTitle:titre||'Enregistrer ou envoyer '+name});
          return repli!==null?{repli:true,erreur:repli}:undefined;
        }catch(e){
          var m=String((e&&e.message)||e);
          if(/cancel|dismiss/i.test(m))return {annule:true};
          alert("Le fichier n'a pas pu être enregistré : "+m);
          return {annule:true};
        }
      },
      envoyerWhatsApp:async function(name,type,b64,texte){
        /* écrit le fichier dans le cache puis ouvre WhatsApp directement sur la liste de ses contacts (plugin natif WaShare) */
        try{
          var FS=plug('Filesystem'),WA=plug('WaShare');
          if(!FS||!WA)return {indispo:true,erreur:'plugin introuvable'};
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          await WA.envoyer({path:w.uri,type:type,texte:texte||''});
          return {ok:true};
        }catch(e){return {indispo:true,erreur:String((e&&e.message)||e)}}
      },
      partager:async function(uri,name){
        try{var SH=plug('Share');if(SH)await SH.share({title:name,url:uri,dialogTitle:'Envoyer '+name})}catch(e){}
      }
    };
  }
  init();
  document.addEventListener('DOMContentLoaded',init);
  window.addEventListener('load',init);
  setTimeout(init,500);
})();
</script>

/* Envoi de la sauvegarde par Bluetooth ou WhatsApp : ouvre la liste de partage du téléphone (Android) ; sans partage possible, le fichier est téléchargé */
async function envoyerSauv(mode){
 const wa=mode==="wa",cible=wa?"WhatsApp":"Bluetooth";
 if(wa&&navigator.onLine===false){toast("WhatsApp nécessite une connexion Internet. Connectez-vous, ou utilisez Bluetooth.");return}
 const name="LoCoREB_sauvegarde_"+new Date().toISOString().slice(0,10)+".json",blob=new Blob([JSON.stringify(S)],{type:"application/json"});
 if(wa&&window.Pont&&window.Pont.envoyerWhatsApp){
  const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const t=String(fr.result);res(t.slice(t.indexOf(",")+1))};fr.onerror=rej;fr.readAsDataURL(blob)});
  const r=await window.Pont.envoyerWhatsApp(name,"application/json",b64,"Sauvegarde LoCoREB");
  if(r&&r.ok)return;
  toast(/absent/i.test((r&&r.erreur)||"")?"WhatsApp n’est pas installé sur ce téléphone : choisissez une autre application dans la liste.":"WhatsApp n’a pas pu s’ouvrir directement : choisissez-le dans la liste de partage.")}
 if(window.Pont&&window.Pont.enregistrer){await saveBlob(blob,name,false,"","Choisissez "+cible+" pour envoyer la sauvegarde");return}
 try{
  const file=new File([blob],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text:"Sauvegarde LoCoREB"});return}
 }catch(e){if(e&&e.name==="AbortError")return}
 saveBlob(blob,name);toast("Le partage n’est pas disponible ici : le fichier a été téléchargé. Envoyez-le ensuite par "+cible+".")}
function restaurer(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.ex||!d.schools)throw 0;S=d;S.zeps=S.zeps||[];normZeps();save();R()}catch(e){alert("Fichier de sauvegarde invalide.")}};r.readAsText(f)}

/* ===== Fusion de données : plusieurs personnes saisissent, puis on réunit les fichiers ===== */
const nkey=t=>nrm(t).replace(/[-_'\u2019.]/g," ").replace(/\s+/g," ").trim();
const aVal=v=>v!==undefined&&v!==null&&v!=="";
function ensureM(x,discs){if(x.m)return;const m={};(discs||[]).forEach(d=>["f","g"].forEach(j=>{if(man(x,d,j))m[d+"|co|"+j]=1}));x.m=m}
function fusionner(T,F,mode,rep){
 const canon=(list,name,kind)=>{const n=String(name==null?"":name).trim();if(!n)return"";const k=nkey(n);let c=list.find(x=>nkey(x)===k);if(!c){list.push(n);c=n;rep[kind]++}return c};
 T.id=T.id||{};T.meta=T.meta||{};T.ex=T.ex||{};T.schools=T.schools||[];T.zeps=T.zeps||[];T.disc=T.disc||[];
 (F.schools||[]).forEach(x=>canon(T.schools,x,"ecoles"));
 (F.zeps||[]).forEach(x=>canon(T.zeps,x,"zeps"));
 (F.disc||[]).forEach(x=>canon(T.disc,x,"disc"));
 Object.keys(F.id||{}).forEach(k=>{if(!aVal(T.id[k])&&aVal(F.id[k]))T.id[k]=F.id[k]});
 Object.keys(F.meta||{}).forEach(sn=>{
  const c=canon(T.schools,sn,"ecoles"),fm=F.meta[sn]||{},tm=T.meta[c]=T.meta[c]||{};
  ["st","zep"].forEach(f=>{let v=fm[f];if(!aVal(v))return;if(f==="zep")v=canon(T.zeps,v,"zeps");
   if(!aVal(tm[f])){tm[f]=v;rep.meta++}
   else if(nkey(tm[f])!==nkey(v)){rep.conf++;rep.confs.push(c+" – "+(f==="st"?"statut":"ZEP"));if(mode==="fichier")tm[f]=v}})});
 Object.keys(F.ex||{}).forEach(n=>{
  const fe=F.ex[n]||{},te=T.ex[n]=T.ex[n]||{niveau:fe.niveau||"CEB",d:{}};te.d=te.d||{};
  if(!Object.keys(te.d).length&&fe.niveau)te.niveau=fe.niveau;
  Object.keys(fe.d||{}).forEach(sn=>{
   const fx=fe.d[sn];if(!fx)return;
   const c=canon(T.schools,sn,"ecoles"),tx=te.d[c]=te.d[c]||{g:{},p:{}};
   tx.g=tx.g||{};tx.p=tx.p||{};ensureM(tx,T.disc);
   const lab=c+" – examen n°"+n;
   const put=(o,j,fv,what)=>{if(!aVal(fv))return;
    if(!aVal(o[j])){o[j]=fv;rep.filled++}
    else if(+o[j]!==+fv){rep.conf++;rep.confs.push(lab+" – "+what);if(mode==="fichier")o[j]=fv}};
   ["ef","co","mo"].forEach(k=>["f","g"].forEach(j=>{
    const fv=fx.g&&fx.g[k]&&fx.g[k][j];if(!aVal(fv))return;
    tx.g[k]=tx.g[k]||{};
    put(tx.g[k],j,fv,(k==="ef"?"effectif":k==="co"?"ont composé":"ont eu la moyenne")+" "+j.toUpperCase())}));
   Object.keys(fx.p||{}).forEach(dn=>{
    const dc=canon(T.disc,dn,"disc"),fp=fx.p[dn]||{};
    tx.p[dc]=tx.p[dc]||{};
    ["f","g"].forEach(j=>{
     const fm=fp.mo&&fp.mo[j];
     if(aVal(fm)){tx.p[dc].mo=tx.p[dc].mo||{};put(tx.p[dc].mo,j,fm,dc+" – ont eu la moyenne "+j.toUpperCase())}
     if(man(fx,dn,j)&&fp.co&&aVal(fp.co[j])){
      const fv=fp.co[j],key=dc+"|co|"+j;tx.p[dc].co=tx.p[dc].co||{};
      if(!tx.m[key]){tx.p[dc].co[j]=fv;tx.m[key]=1;rep.filled++}
      else if(+tx.p[dc].co[j]!==+fv){rep.conf++;rep.confs.push(lab+" – "+dc+" – ont composé "+j.toUpperCase());if(mode==="fichier")tx.p[dc].co[j]=fv}}})})})})}
function fusionRun(files,mode){
 const T=JSON.parse(JSON.stringify(S)),rep={ecoles:0,zeps:0,disc:0,meta:0,filled:0,conf:0,confs:[]};
 files.forEach(f=>fusionner(T,f.d,mode,rep));
 T.schools.sort((a,b)=>a.localeCompare(b,"fr"));{const U=z=>String(z==null?"":z).trim().toLocaleUpperCase("fr"),vu=new Set();T.zeps=T.zeps.map(U).filter(z=>{const k=z.toLowerCase();if(!z||vu.has(k))return false;vu.add(k);return true});Object.values(T.meta||{}).forEach(m=>{if(m&&m.zep)m.zep=U(m.zep)})}T.zeps.sort((a,b)=>a.localeCompare(b,"fr"));
 return {T,rep}}
let FUS=null;
function fusionChoisir(el){
 const fs=[...el.files];el.value="";if(!fs.length)return;
 Promise.all(fs.map(f=>new Promise(ok=>{const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object"||!d.ex||!d.schools)throw 0;ok({name:f.name,d})}catch(e){ok({name:f.name,err:1})}};
  r.onerror=()=>ok({name:f.name,err:1});r.readAsText(f)}))).then(L=>fusionApercu(L))}
function fusionApercu(L){
 const good=L.filter(x=>!x.err),bad=L.filter(x=>x.err);
 if(!good.length){alert("Aucun fichier de sauvegarde valide.");return}
 FUS={good};
 const {rep}=fusionRun(good,"garder"),nul=!(rep.ecoles||rep.zeps||rep.disc||rep.meta||rep.filled||rep.conf);
 const li=t=>`<li>${t}</li>`;
 const lines=[li(`Fichiers lus : <b>${good.length}</b>`+(bad.length?` (non valides, ignorés : ${bad.map(x=>esc(x.name)).join(", ")})`:"")),
  li(`Écoles ajoutées : <b>${rep.ecoles}</b>`),li(`ZEP ajoutées : <b>${rep.zeps}</b>`),li(`Disciplines ajoutées : <b>${rep.disc}</b>`),
  li(`Cases de résultats complétées : <b>${rep.filled+rep.meta}</b>`),li(`Valeurs différentes (conflits) : <b>${rep.conf}</b>`)].join("");
 const ex=rep.confs.slice(0,8).map(x=>li(esc(x))).join("")+(rep.confs.length>8?li("… et "+(rep.confs.length-8)+" autre(s)"):"");
 const d=document.createElement("div");d.className="fmod np";d.id="fmod";d.setAttribute("role","dialog");d.setAttribute("aria-label","Fusion des données");
 d.innerHTML=`<div><h3 style="margin-top:0">Fusion des données</h3><ul>${lines}</ul>`
  +(nul?`<p class="mu">Rien de nouveau : ces fichiers ne contiennent pas de données absentes de votre application.</p>`:"")
  +(rep.conf?`<p><b>Si une même case a des valeurs différentes :</b></p><label style="display:block"><input type="radio" name="fmode" value="garder" checked style="width:auto;display:inline;margin:0 6px 0 0"> Garder mes valeurs (celles déjà saisies)</label><label style="display:block"><input type="radio" name="fmode" value="fichier" style="width:auto;display:inline;margin:0 6px 0 0"> Prendre les valeurs des fichiers</label><ul class="mu">${ex}</ul>`:"")
  +`<p class="mu">Les cases vides sont complétées avec les données des fichiers. Une sauvegarde de vos données actuelles est conservée : vous pourrez annuler la fusion depuis la page Identification.</p>
  <div class="ctl"><button class="bt" onclick="fusionAppliquer()"${nul?" disabled":""}>Appliquer la fusion</button><button class="bt" onclick="fusionFermer()">Annuler</button></div></div>`;
 document.body.appendChild(d)}
function fusionFermer(){const d=$("fmod");if(d)d.remove();FUS=null}
function fusionAppliquer(){
 if(!FUS)return;
 const m=document.querySelector("#fmod input[name=fmode]:checked"),mode=m?m.value:"garder",{T}=fusionRun(FUS.good,mode);
 try{localStorage.setItem(KEY+"_avant_fusion",JSON.stringify({t:Date.now(),s:S}))}catch(e){}
 const ui=S.ui;S=T;S.ui=ui||T.ui;normDisc();save();fusionFermer();R();toast("Fusion appliquée.")}
function annulerFusion(){
 try{const b=JSON.parse(localStorage.getItem(KEY+"_avant_fusion"));if(!b||!b.s)throw 0;
  if(!confirm("Revenir aux données d'avant la dernière fusion ?"))return;
  S=b.s;S.zeps=S.zeps||[];normZeps();save();localStorage.removeItem(KEY+"_avant_fusion");R();toast("Fusion annulée.")}

const grpBy=(f,em,or=[])=>{const m=new Map();
 S.schools.forEach(s=>{const raw=(f(s)||"").trim(),k=raw.toLowerCase();if(!m.has(k))m.set(k,{name:raw||em,list:[],k});m.get(k).list.push(s)});
 const r=x=>x.k==""?1e9:(or.indexOf(x.k)<0?or.length:or.indexOf(x.k));

/* ===== Licence (même principe que LoGeNo : identifiant propre à l'appareil + code signé Ed25519 avec date d'expiration) ===== */
const LIC_KEY="locoreb-lic-v1",LPUB="86abec07e30211fd8bee4cdc7a548600b6ec823b3e7575f0ad202a8fec6f86c5",B32A="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",WA_NUM="22678214250";
let WL=null;
const p2=n=>String(n).padStart(2,"0");
const fmtDate=s=>{const a=String(s).split("-");return a[2]+"/"+a[1]+"/"+a[0]};
const lHex=h=>{const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o};
const lUtf8=s=>{s=unescape(encodeURIComponent(s));const o=new Uint8Array(s.length);for(let i=0;i<s.length;i++)o[i]=s.charCodeAt(i);return o};
const lIso=n=>{const d=new Date(n*864e5);return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())};
function lB32dec(s){const out=[];let bits=0,v=0;for(let i=0;i<s.length;i++){const k=B32A.indexOf(s.charAt(i));if(k<0)return null;v=(v<<5)|k;bits+=5;if(bits>=8){out.push((v>>>(bits-8))&255);bits-=8;v&=(1<<bits)-1}}return new Uint8Array(out)}
const lClean=x=>String(x||"").toUpperCase().replace(/[^A-Z2-7]/g,"");
const lExtract=t=>{t=String(t||"").toUpperCase();const m=t.match(/(?:[A-Z2-7]{6}-){17}[A-Z2-7]{1,6}/);return lClean(m?m[0]:t)};
const lSave=()=>{try{localStorage.setItem(LIC_KEY,JSON.stringify(WL))}catch(e){}};
/* Vérifie un code délivré par le générateur : signature Ed25519 de « LOGEB1|identifiant|jours » */
function licCheck(code,id){
 try{
  if(typeof nacl==="undefined")return null;
  let b=lB32dec(lExtract(code));const i10=lClean(id);
  if(!b||b.length<67||i10.length!==10)return null;
  b=b.subarray(0,67);
  const days=(b[0]<<16)|(b[1]<<8)|b[2],sig=b.subarray(3,67);
  if(!nacl.sign.detached.verify(lUtf8("LOGEB1|"+i10+"|"+days),sig,lHex(LPUB)))return null;
  return {until:lIso(days),days}
 }catch(e){return null}}
function wlState(){
 let o=WL;
 if(!o){try{o=JSON.parse(localStorage.getItem(LIC_KEY)||"null")}catch(e){o=null}}
 if(!o||typeof o!=="object")o={};
 if(!/^[A-Z2-7]{5}-[A-Z2-7]{5}$/.test(o.id||"")){
  let q="";const r=new Uint8Array(10);
  try{crypto.getRandomValues(r)}catch(e){for(let j=0;j<10;j++)r[j]=Math.floor(Math.random()*256)}
  for(let i=0;i<10;i++){q+=B32A.charAt(r[i]&31);if(i===4)q+="-"}
  o.id=q;delete o.code}
 const t=today();if(!o.seen||o.seen<t)o.seen=t;
 WL=o;lSave();return o}
function licInfo(){
 try{
  const o=wlState(),v=o.code?licCheck(o.code,o.id):null;
  if(!v)return {id:o.id,until:null,jours:null,bloque:true,first:true};
  const a=o.seen.split("-"),b=v.until.split("-");
  const j=Math.round((Date.UTC(+b[0],+b[1]-1,+b[2])-Date.UTC(+a[0],+a[1]-1,+a[2]))/864e5);
  return {id:o.id,until:v.until,jours:j,bloque:j<0,first:false}
 }catch(e){return {id:"",until:null,jours:null,bloque:true,first:true}}}
function licActivate(code){
 const o=wlState(),v=licCheck(code,o.id);
 if(!v)return {ok:false,message:"Code de licence invalide, ou délivré pour un autre appareil. Vérifiez que l’identifiant envoyé est bien celui affiché ici."};
 if(v.until<o.seen)return {ok:false,message:"Ce code a expiré le "+fmtDate(v.until)+". Demandez un nouveau code."};
 const cur=o.code?licCheck(o.code,o.id):null;
 if(cur&&v.until<=cur.until)return {ok:false,message:"Ce code ne prolonge pas la licence (déjà valable jusqu’au "+fmtDate(cur.until)+")."};
 o.code=lExtract(code);WL=o;lSave();
 return {ok:true,message:(cur?"Licence prolongée":"Application activée")+" jusqu’au "+fmtDate(v.until)+"."}}
const waLink=id=>"https://wa.me/"+WA_NUM+"?text="+encodeURIComponent("Bonjour, voici l’identifiant de mon application LoCoREB : "+id+". Merci de m’envoyer le code de licence.");

 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(id).then(ok,fb);else fb()}
