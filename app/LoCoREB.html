<script>
/* Enregistrement des fichiers dans l'APK (Capacitor) : écrit dans le cache puis ouvre le partage Android */
(function(){
  function plug(n){
    var C=window.Capacitor;if(!C)return null;
    if(C.Plugins&&C.Plugins[n])return C.Plugins[n];
    if(typeof C.registerPlugin==='function'){try{return C.registerPlugin(n)}catch(e){}}
    return null;
  }
  function isNative(){
    var C=window.Capacitor;if(!C)return false;
    try{
      if(typeof C.isNativePlatform==='function')return !!C.isNativePlatform();
      if(typeof C.getPlatform==='function')return C.getPlatform()!=='web';
    }catch(e){}
    return /; wv\)/.test(navigator.userAgent);
  }
  function init(){
    if(window.Pont||!isNative())return;
    window.Pont={
      enregistrer:async function(name,type,b64,dossier){
        var FS=plug('Filesystem'),SH=plug('Share'),repli=null;
        try{
          if(!FS)throw new Error('plugin introuvable (Filesystem)');
          if(dossier){
            /* Création du dossier dans « Documents » puis enregistrement du fichier dedans */
            try{
              try{var pm=await FS.checkPermissions();if(pm&&pm.publicStorage&&pm.publicStorage!=='granted')await FS.requestPermissions()}catch(e){}
              var rel=dossier+'/'+name;
              await FS.writeFile({path:rel,data:b64,directory:'DOCUMENTS',recursive:true});
              var g=await FS.getUri({path:rel,directory:'DOCUMENTS'});
              var ch=decodeURI(String(g.uri).replace(/^file:\/\//,''));
              return {chemin:ch,dossier:dossier,dossierChemin:ch.slice(0,ch.lastIndexOf('/')),uri:g.uri};
            }catch(e){repli=String((e&&e.message)||e)}
          }
          if(!SH)throw new Error('plugin introuvable (Share)');
          var w=await FS.writeFile({path:name,data:b64,directory:'CACHE',recursive:true});
          await SH.share({title:name,url:w.uri,dialogTitle:'Enregistrer ou envoyer '+name});
          return repli!==null?{repli:true,erreur:repli}:undefined;
        }catch(e){
          var m=String((e&&e.message)||e);
          if(/cancel|dismiss/i.test(m))return {annule:true};
          alert("Le fichier n'a pas pu être enregistré : "+m);
          return {annule:true};
        }
      },
      partager:async function(uri,name){
        try{var SH=plug('Share');if(SH)await SH.share({title:name,url:uri,dialogTitle:'Envoyer '+name})}catch(e){}
      }
    };
  }
  init();
  document.addEventListener('DOMContentLoaded',init);
  window.addEventListener('load',init);
  setTimeout(init,500);
})();
</script>

 S.disc.forEach(d=>r.p[d]={co:z(),mo:z()});
 list.forEach(s=>{const x=(S.ex[n]||{d:{}}).d[s];if(!x)return;
  K.forEach(k=>["f","g"].forEach(j=>r.g[k][j]+=num(x.g&&x.g[k]&&x.g[k][j])));
  S.disc.forEach(d=>["co","mo"].forEach(k=>["f","g"].forEach(j=>r.p[d][k][j]+=(k=="co"?effco(x,d,j):num(x.p&&x.p[d]&&x.p[d][k]&&x.p[d][k][j])))))});
 return r}

function val(r,q){
 const [t,a,b,c]=q.split(".");
 const o=t=="g"?r.g:r.p[S.disc[+a]],k=t=="g"?a:b,j=t=="g"?b:c;
 if(k=="tx")return j=="t"?pc(o.mo.f+o.mo.g,o.co.f+o.co.g):pc(o.mo[j],o.co[j]);
 return o[k].f+o[k].g}

function tabs(r,edit){
 const cell=(p,v)=>{const c=p.endsWith(".f")?' class="fr"':"";return edit?`<td${c}><input type="number" min="0" data-p="${p}"${/^p\.\d+\.co\./.test(p)?' tabindex="-1"':' enterkeyhint="next"'} value="${v||""}" oninput="setv(this)" onchange="fix(this)" aria-label="${p}"></td>`:`<td${c}>${v}</td>`};
 const cm=q=>edit&&q.endsWith(".t")&&!q.includes(".tx.")?`<td class="c"><input readonly tabindex="-1" data-q="${q}" value="${val(r,q)}" aria-label="${q}"></td>`:`<td class="c${q.endsWith(".f")?" fr":""}" data-q="${q}">${val(r,q)}</td>`;
 const g=K.map((k,i)=>`<tr><th>${LB[i]}</th>${cell("g."+k+".f",r.g[k].f)}${cell("g."+k+".g",r.g[k].g)}${cm("g."+k+".t")}</tr>`).join("")
  +`<tr class="tot"><th>Taux de réussite</th>${["f","g","t"].map(j=>cm("g.tx."+j)).join("")}</tr>`;
 const p=S.disc.map((d,i)=>`<tr><th>${esc(d)}</th>`+["co","mo"].map(k=>cell(`p.${i}.${k}.f`,r.p[d][k].f)+cell(`p.${i}.${k}.g`,r.p[d][k].g)+cm(`p.${i}.${k}.t`)).join("")+["f","g","t"].map(j=>cm(`p.${i}.tx.${j}`)).join("")+"</tr>").join("");
 const fgt='<th class="fr fg">F</th><th class="fg">G</th><th class="fg">T</th>';
 return `<h3>RÉSULTATS GLOBAUX</h3><div class="w"><table><thead><tr><th class="ve"></th>${fgt}</tr></thead><tbody>${g}</tbody></table></div>
<h3>TAUX DE RÉUSSITE PAR DISCIPLINE</h3><div class="w"><table class="fx"><thead><tr><th rowspan="2">Disciplines</th><th colspan="3">Ont composé</th><th colspan="3">Ont eu la moyenne</th><th colspan="3">Taux de réussite</th></tr><tr>${fgt}${fgt}${fgt}</tr></thead><tbody>${p}</tbody></table></div>`}

function setv(el){
 const [t,a,b,c]=el.dataset.p.split("."),x=D(S.ui.n,S.ui.school);
 if(!x.m){x.m={};S.disc.forEach(d=>["f","g"].forEach(j=>{if(man(x,d,j))x.m[d+"|co|"+j]=1}))}
 if(t=="g"){(x.g[a]=x.g[a]||{})[b]=el.value}
 else{const d=S.disc[+a];x.p[d]=x.p[d]||{};(x.p[d][b]=x.p[d][b]||{})[c]=el.value;
  if(b=="co"){if(el.value==="")delete x.m[d+"|co|"+c];else x.m[d+"|co|"+c]=1}}
 save();refresh(false)}
function lim(x,p){
 const [t,a,b,c]=p.split(".");
 if(t=="g")return a=="co"?num(x.g.ef&&x.g.ef[b]):a=="mo"?num(x.g.co&&x.g.co[b]):Infinity;
 return b=="co"?num(x.g.ef&&x.g.ef[c]):effco(x,S.disc[+a],c)}
function fix(el){
 const x=D(S.ui.n,S.ui.school);
 if(el.value!==""){let v=Math.max(0,Math.floor(num(el.value))),L=lim(x,el.dataset.p);
  if(v>L){v=L;NOTE="Valeur ramenée à "+L+" (maximum autorisé)."}
  el.value=v}
 setv(el);refresh(true)}
function refresh(force){
 const n=S.ui.n,x=D(n,S.ui.school),r=agg(n,[S.ui.school]);
 document.querySelectorAll("[data-q]").forEach(e=>{const v=val(r,e.dataset.q);if(e.tagName==="INPUT")e.value=v;else e.textContent=v});
 document.querySelectorAll("input[data-p]").forEach(i=>{
  const [t,a,b,c]=i.dataset.p.split(".");
  if(t=="p"&&b=="co"&&(force||document.activeElement!==i))i.value=r.p[S.disc[+a]].co[c]||""});
 validate(x)}
function validate(x){
 const m=[],bad=new Set(),V=(p,t)=>{bad.add(p);m.push(t)};
 const ef=j=>num(x.g.ef&&x.g.ef[j]),gc=j=>num(x.g.co&&x.g.co[j]),gm=j=>num(x.g.mo&&x.g.mo[j]);
 ["f","g"].forEach(j=>{const sx=j=="f"?"filles":"garçons";
  if(gc(j)>ef(j))V("g.co."+j,`Résultats globaux (${sx}) : « Ont composé » (${gc(j)}) dépasse l’effectif (${ef(j)}).`);
  if(gm(j)>gc(j))V("g.mo."+j,`Résultats globaux (${sx}) : « Ont eu la moyenne » (${gm(j)}) dépasse « Ont composé » (${gc(j)}).`);
  S.disc.forEach((d,i)=>{const c=effco(x,d,j),mo=num(x.p[d]&&x.p[d].mo&&x.p[d].mo[j]);
   if(c>ef(j))V(`p.${i}.co.${j}`,`${d} (${sx}) : « Ont composé » (${c}) dépasse l’effectif (${ef(j)}).`);
   if(mo>c)V(`p.${i}.mo.${j}`,`${d} (${sx}) : « Ont eu la moyenne » (${mo}) dépasse « Ont composé » (${c}).`)})});
 document.querySelectorAll("input[data-p]").forEach(i=>i.classList.toggle("bad",bad.has(i.dataset.p)));
 const b=$("vmsg");
 if(b)b.innerHTML=(NOTE?esc(NOTE)+"<br>":"")+m.slice(0,6).map(esc).join("<br>")+(m.length>6?"<br>…":"");
 NOTE=""}

/* ===== Fusion de données : plusieurs personnes saisissent, puis on réunit les fichiers ===== */
const nkey=t=>nrm(t).replace(/[-_'\u2019.]/g," ").replace(/\s+/g," ").trim();
const aVal=v=>v!==undefined&&v!==null&&v!=="";
function ensureM(x,discs){if(x.m)return;const m={};(discs||[]).forEach(d=>["f","g"].forEach(j=>{if(man(x,d,j))m[d+"|co|"+j]=1}));x.m=m}
function fusionner(T,F,mode,rep){
 const canon=(list,name,kind)=>{const n=String(name==null?"":name).trim();if(!n)return"";const k=nkey(n);let c=list.find(x=>nkey(x)===k);if(!c){list.push(n);c=n;rep[kind]++}return c};
 T.id=T.id||{};T.meta=T.meta||{};T.ex=T.ex||{};T.schools=T.schools||[];T.zeps=T.zeps||[];T.disc=T.disc||[];
 (F.schools||[]).forEach(x=>canon(T.schools,x,"ecoles"));
 (F.zeps||[]).forEach(x=>canon(T.zeps,x,"zeps"));
 (F.disc||[]).forEach(x=>canon(T.disc,x,"disc"));
 Object.keys(F.id||{}).forEach(k=>{if(!aVal(T.id[k])&&aVal(F.id[k]))T.id[k]=F.id[k]});
 Object.keys(F.meta||{}).forEach(sn=>{
  const c=canon(T.schools,sn,"ecoles"),fm=F.meta[sn]||{},tm=T.meta[c]=T.meta[c]||{};
  ["st","zep"].forEach(f=>{let v=fm[f];if(!aVal(v))return;if(f==="zep")v=canon(T.zeps,v,"zeps");
   if(!aVal(tm[f])){tm[f]=v;rep.meta++}
   else if(nkey(tm[f])!==nkey(v)){rep.conf++;rep.confs.push(c+" – "+(f==="st"?"statut":"ZEP"));if(mode==="fichier")tm[f]=v}})});
 Object.keys(F.ex||{}).forEach(n=>{
  const fe=F.ex[n]||{},te=T.ex[n]=T.ex[n]||{niveau:fe.niveau||"CEB",d:{}};te.d=te.d||{};
  if(!Object.keys(te.d).length&&fe.niveau)te.niveau=fe.niveau;
  Object.keys(fe.d||{}).forEach(sn=>{
   const fx=fe.d[sn];if(!fx)return;
   const c=canon(T.schools,sn,"ecoles"),tx=te.d[c]=te.d[c]||{g:{},p:{}};
   tx.g=tx.g||{};tx.p=tx.p||{};ensureM(tx,T.disc);
   const lab=c+" – examen n°"+n;
   const put=(o,j,fv,what)=>{if(!aVal(fv))return;
    if(!aVal(o[j])){o[j]=fv;rep.filled++}
    else if(+o[j]!==+fv){rep.conf++;rep.confs.push(lab+" – "+what);if(mode==="fichier")o[j]=fv}};
   ["ef","co","mo"].forEach(k=>["f","g"].forEach(j=>{
    const fv=fx.g&&fx.g[k]&&fx.g[k][j];if(!aVal(fv))return;
    tx.g[k]=tx.g[k]||{};
    put(tx.g[k],j,fv,(k==="ef"?"effectif":k==="co"?"ont composé":"ont eu la moyenne")+" "+j.toUpperCase())}));
   Object.keys(fx.p||{}).forEach(dn=>{
    const dc=canon(T.disc,dn,"disc"),fp=fx.p[dn]||{};
    tx.p[dc]=tx.p[dc]||{};
    ["f","g"].forEach(j=>{
     const fm=fp.mo&&fp.mo[j];
     if(aVal(fm)){tx.p[dc].mo=tx.p[dc].mo||{};put(tx.p[dc].mo,j,fm,dc+" – ont eu la moyenne "+j.toUpperCase())}
     if(man(fx,dn,j)&&fp.co&&aVal(fp.co[j])){

/* Fenêtre qui indique l'emplacement exact du dossier des PDF */
function infoDossier(r,name,dossier){

 const ch=String(r.chemin||""),sep=ch.indexOf("\\")>=0?"\\":"/",i=ch.lastIndexOf(sep),dir=r.dossierChemin||(i>0?ch.slice(0,i):""),

 let h;
 if(cree){
  const an=/^\/storage\/emulated\/0\//.test(dir)?`<p class="mu">Dans l’application « Fichiers » : ${esc(dir.replace(/^\/storage\/emulated\/0\//,"Stockage interne › ").split("/").join(" › "))}</p>`:"";
  h=`<h3 style="margin-top:0;color:var(--ac)">Dossier créé</h3><p>Le dossier <b>${esc(dossier)}</b> a été créé et le fichier <b>${esc(name)}</b> y a été enregistré.</p><p style="margin-bottom:0">Emplacement exact du dossier :</p>${loc(dir)}${an}`}
 else if(ch){

  h=`<h3 style="margin-top:0">Fichier téléchargé</h3><p>Le fichier <b>${esc(name)}</b> a été téléchargé dans le dossier de téléchargement de votre navigateur.</p><p class="warn">Un navigateur ne permet pas à une page de créer le dossier « ${esc(dossier)} » : pour cela, utilisez l’application installée (Windows ou Android).</p>`}
 else if(r.repli){
  h=`<h3 style="margin-top:0;color:var(--rd)">Dossier non créé</h3><p>Le dossier « ${esc(dossier)} » n’a pas pu être créé sur cet appareil${r.erreur?" ("+esc(r.erreur)+")":""}. Vérifiez que l’application a l’autorisation d’accéder au stockage.</p><p>Le fichier <b>${esc(name)}</b> a été proposé au partage : choisissez l’emplacement où l’enregistrer.</p>`}
 else{

 d.innerHTML=`<div>${h}<div class="ctl" style="justify-content:flex-end;margin:14px 0 0">${sh}<button class="bt" type="button" id="pok" onclick="this.closest('.fmod').remove()">OK</button></div></div>`;

/* Enregistrement d'un fichier : application Windows (boîte « Enregistrer sous »), APK (partage Android) ou navigateur (téléchargement) */
async function saveBlob(blob,name,ouvrir,dossier){
 try{
  if(window.Pont&&window.Pont.enregistrer){
   const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const s=String(fr.result);res(s.slice(s.indexOf(",")+1))};fr.onerror=rej;fr.readAsDataURL(blob)});
   const r=await window.Pont.enregistrer(name,blob.type||"application/octet-stream",b64,dossier||"");
   if(r&&r.annule)return;
   if(ouvrir&&r&&r.chemin&&window.Pont.ouvrir){try{await window.Pont.ouvrir(r.chemin)}catch(e){}}
   if(dossier){infoDossier(r||{},name,dossier);return}
    toast(r&&r.chemin?"Fichier enregistré : "+r.chemin:"Fichier prêt : "+name);return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  if(ouvrir)try{window.open(u,"_blank")}catch(e){}
  setTimeout(()=>URL.revokeObjectURL(u),60000);if(dossier)infoDossier({navigateur:true},name,dossier);else toast("Fichier téléchargé : "+name)
 }catch(e){toast("Le fichier n’a pas pu être enregistré.")}}

function sansDoublon(el,key){

 brut.split(NL).forEach(l=>{const t=l.trim();if(!t)return;const k=kk(t);if(vu.has(k)){dbl=true;if(!noms.includes(vu.get(k)))noms.push(vu.get(k));return}const tt=key==="zeps"?t.toLocaleUpperCase("fr"):t;vu.set(k,tt);res.push(tt)});
 S[key]=res;save();
 if(dbl){
  const lab=el.closest("label")||el.parentNode;
  const ancien=lab.parentNode.querySelector(".dblbox");if(ancien)ancien.remove();
  el.value=res.join(NL)+(brut.endsWith(NL)?NL:"");
  const msg=noms.map(n=>(key==="schools"?"L'école ":key==="zeps"?"La ZEP ":"La discipline ")+esc(key==="schools"?UPS(n):n)+" a déjà été saisie.").join("<br>");
  const d=document.createElement("div");d.className="dblbox";d.setAttribute("role","alert");
  d.style.cssText="margin:10px 0;padding:10px 14px;border:2px solid #d00000;border-radius:8px;background:#fdecec;color:#c00000;font-weight:600;position:relative";
  d.innerHTML='<div style="font-size:1.05em;margin-bottom:4px">Doublons détectés</div><div>'+msg+'</div><button type="button" aria-label="Fermer" style="position:absolute;top:6px;right:8px;border:0;background:none;color:#c00000;font-size:18px;cursor:pointer" onclick="this.parentNode.remove()">×</button>';
  lab.parentNode.insertBefore(d,lab.nextSibling);
  setTimeout(()=>{if(d.parentNode)d.remove()},8000);
 }
}

function cbKey(e,el){

/* Saisie des résultats : flèches et Entrée pour passer d'une case à l'autre (toutes les cases de saisie) */
const MOA="#app table input[data-p]",MOQ=MOA+":not([tabindex='-1'])";
document.addEventListener("keydown",e=>{
 const el=e.target;
 if(!el||!el.matches||!el.matches(MOA)||e.ctrlKey||e.altKey||e.metaKey)return;
 const k=e.key,ent=(k==="Enter"||k==="NumpadEnter"||e.keyCode===13);
 if(!ent&&k!=="ArrowLeft"&&k!=="ArrowRight"&&k!=="ArrowUp"&&k!=="ArrowDown")return;
 const rows=[...document.querySelectorAll("#app tr")].map(tr=>[...tr.querySelectorAll(MOA)]).filter(r=>r.length);
 const ri=rows.findIndex(r=>r.includes(el));
 if(ri<0)return;
 const ci=rows[ri].indexOf(el);let to=null;
 if(ent){const all=[...document.querySelectorAll(MOQ)];
  to=e.shiftKey?all.filter(x=>el.compareDocumentPosition(x)&Node.DOCUMENT_POSITION_PRECEDING).pop()
               :all.find(x=>el.compareDocumentPosition(x)&Node.DOCUMENT_POSITION_FOLLOWING)}
 else if(k==="ArrowRight")to=rows[ri][ci+1];
 else if(k==="ArrowLeft")to=rows[ri][ci-1];
 else{const r=rows[ri+(k==="ArrowDown"?1:-1)];if(r)to=r[Math.min(ci,r.length-1)]}
 e.preventDefault();
 if(to){to.focus();if(to.select)to.select()}
 else if(ent)el.blur()});
/* Colonne « T » toujours en gras, dans tous les tableaux F / G / T */
function boldT(){document.querySelectorAll("#app table").forEach(t=>{
 const hr=t.tHead?[...t.tHead.rows]:[];if(!hr.length)return;
 const occ=[],tc=[];
 hr.forEach((tr,ri)=>{occ[ri]=occ[ri]||[];let ci=0;
  [...tr.cells].forEach(c=>{while(occ[ri][ci])ci++;const cs=c.colSpan||1,rs=c.rowSpan||1;
   for(let a=0;a<rs;a++){occ[ri+a]=occ[ri+a]||[];for(let b=0;b<cs;b++)occ[ri+a][ci+b]=1}
   if(cs===1&&c.textContent.trim()==="T")tc.push(ci);ci+=cs})});
 [...t.tBodies].forEach(tb=>[...tb.rows].forEach(tr=>tc.forEach(i=>{const c=tr.cells[i];if(c&&c.tagName==="TD")c.classList.add("b")})))})}
